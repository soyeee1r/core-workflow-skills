<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="个人工作助理：证据、累计状态、七种模式与交付"><title>个人工作助理：证据、累计状态、七种模式与交付</title><rect width="100%" height="100%" fill="#111718"/><text x="44" y="62" font-size="22" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">PERSONAL WORK SYSTEM</text><text x="44" y="116" font-size="42" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">让今天的行动，接得住昨天的进展。</text><text x="44" y="162" font-size="22" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">按模式与目标日期运行；日程约束行动，实际证据支撑复盘。</text><rect x="44" y="210" width="410" height="140" fill="#1b2425" stroke="#3c4a46"/><text x="64" y="245" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">01  输入</text><text x="64" y="278" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">允许的工作证据</text><text x="64" y="312" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">周报 / 消息与回复 / 项目 / 日程</text><rect x="514" y="210" width="410" height="140" fill="#1b2425" stroke="#3c4a46"/><text x="534" y="245" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">02  记忆</text><text x="534" y="278" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">累计个人状态</text><text x="534" y="312" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">稿件 / 选题 / 未闭环 / 下一步</text><rect x="984" y="210" width="410" height="140" fill="#1b2425" stroke="#3c4a46"/><text x="1004" y="245" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">03  核对</text><text x="1004" y="278" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">完整读取与判断</text><text x="1004" y="312" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">去重、来源、纠正 / 计划与成果分开</text><path d="M454 280 L502 280" stroke="#d9f56a" stroke-width="2" fill="none"/><polyline points="494.0,285.0 502,280 494.0,275.0" stroke="#d9f56a" stroke-width="2" fill="none"/><path d="M924 280 L972 280" stroke="#d9f56a" stroke-width="2" fill="none"/><polyline points="964.0,285.0 972,280 964.0,275.0" stroke="#d9f56a" stroke-width="2" fill="none"/><text x="44" y="410" font-size="24" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">七种模式，共享同一套个人事实</text><text x="44" y="449" font-size="21" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">晨间六栏：近期进展 · 今日日程 · 今日待办 · 稿件进度 · 选题储备 · 待确认</text><rect x="44" y="490" width="316" height="130" fill="#1b2425" stroke="#3c4a46"/><text x="64" y="525" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">01</text><text x="64" y="558" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">晨间面板</text><text x="64" y="592" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">累计状态 + 今日可用时间</text><rect x="388" y="490" width="316" height="130" fill="#1b2425" stroke="#3c4a46"/><text x="408" y="525" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">02</text><text x="408" y="558" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">周初排期</text><text x="408" y="592" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">复制上周 / 带入遗留 / 保留结构</text><rect x="732" y="490" width="316" height="130" fill="#1b2425" stroke="#3c4a46"/><text x="752" y="525" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">03</text><text x="752" y="558" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">今日计划</text><text x="752" y="592" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">优先级 + 结果型验收</text><rect x="1076" y="490" width="316" height="130" fill="#1b2425" stroke="#3c4a46"/><text x="1096" y="525" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">04</text><text x="1096" y="558" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">每日复盘</text><text x="1096" y="592" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">实际动作 + 未完成原因</text><rect x="44" y="644" width="316" height="130" fill="#1b2425" stroke="#3c4a46"/><text x="64" y="679" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">05</text><text x="64" y="712" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">周度收口</text><text x="64" y="746" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">核心交付 / 决策 / 下周遗留</text><rect x="388" y="644" width="316" height="130" fill="#1b2425" stroke="#3c4a46"/><text x="408" y="679" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">06</text><text x="408" y="712" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">月度收口</text><text x="408" y="746" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">全月事实 / 统计口径 / 缺口</text><rect x="732" y="644" width="316" height="130" fill="#1b2425" stroke="#3c4a46"/><text x="752" y="679" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">07</text><text x="752" y="712" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">只读审计</text><text x="752" y="746" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">版本差异 / 人工纠正</text><rect x="1076" y="644" width="316" height="130" fill="#1b2425" stroke="#3c4a46"/><text x="1096" y="679" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">运行条件</text><text x="1096" y="712" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">按需执行</text><text x="1096" y="746" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">安装不启用自动化</text><text x="44" y="834" font-size="24" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">交付取决于请求中的有效授权</text><text x="44" y="880" font-size="22" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">查看 → 草稿     |     晨间自动化 → 私聊面板     |     明确写入 → 指定日期或总结区</text><text x="44" y="925" font-size="22" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">写前核对版本，写后回读；私聊需要消息 ID，文档需要回读验收。</text><text x="44" y="981" font-size="21" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">预检不完整：不发送、不写回。未闭环事项继续保留到下一次判断。</text></svg>