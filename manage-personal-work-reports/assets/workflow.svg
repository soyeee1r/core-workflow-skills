<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="个人助理：七种工作模式"><title>个人助理：七种工作模式</title><rect x="0" y="0" width="1440" height="860" rx="0" fill="#131C20"/><text x="56" y="66" font-size="18" font-weight="400" fill="#B9D7C2" font-family="PingFang SC,Microsoft YaHei,sans-serif">0615  /  个人助理</text><text x="56" y="137" font-size="48" font-weight="600" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">让每天的工作，持续接续。</text><text x="57" y="187" font-size="22" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">工作证据  ·  累计状态  ·  今日时间</text><rect x="56" y="232" width="1328" height="131" rx="18" fill="#1C3330"/><text x="82" y="277" font-size="29" font-weight="600" fill="#B9D7C2" font-family="PingFang SC,Microsoft YaHei,sans-serif">晨间面板</text><text x="82" y="321" font-size="24" font-weight="400" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">近期进展 / 今日日程 / 今日待办 / 稿件进度 / 选题储备 / 待确认</text><text x="57" y="424" font-size="19" font-weight="400" fill="#B9D7C2" font-family="PingFang SC,Microsoft YaHei,sans-serif">02</text><text x="57" y="468" font-size="28" font-weight="600" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">周初排期</text><text x="57" y="507" font-size="21" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">接续上周遗留，安排本周</text><path d="M57 529 L448 529" stroke="#2D3B40" stroke-width="1"/><text x="511" y="424" font-size="19" font-weight="400" fill="#B9D7C2" font-family="PingFang SC,Microsoft YaHei,sans-serif">03</text><text x="511" y="468" font-size="28" font-weight="600" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">今日计划</text><text x="511" y="507" font-size="21" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">确定优先级与验收结果</text><path d="M511 529 L902 529" stroke="#2D3B40" stroke-width="1"/><text x="965" y="424" font-size="19" font-weight="400" fill="#B9D7C2" font-family="PingFang SC,Microsoft YaHei,sans-serif">04</text><text x="965" y="468" font-size="28" font-weight="600" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">每日复盘</text><text x="965" y="507" font-size="21" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">核实动作、原因和下一步</text><path d="M965 529 L1356 529" stroke="#2D3B40" stroke-width="1"/><text x="57" y="575" font-size="19" font-weight="400" fill="#B9D7C2" font-family="PingFang SC,Microsoft YaHei,sans-serif">05</text><text x="57" y="619" font-size="28" font-weight="600" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">周度收口</text><text x="57" y="658" font-size="21" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">汇总交付，保留下周遗留</text><path d="M57 680 L448 680" stroke="#2D3B40" stroke-width="1"/><text x="511" y="575" font-size="19" font-weight="400" fill="#B9D7C2" font-family="PingFang SC,Microsoft YaHei,sans-serif">06</text><text x="511" y="619" font-size="28" font-weight="600" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">月度收口</text><text x="511" y="658" font-size="21" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">核对全月成果与统计范围</text><path d="M511 680 L902 680" stroke="#2D3B40" stroke-width="1"/><text x="965" y="575" font-size="19" font-weight="400" fill="#B9D7C2" font-family="PingFang SC,Microsoft YaHei,sans-serif">07</text><text x="965" y="619" font-size="28" font-weight="600" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">只读审计</text><text x="965" y="658" font-size="21" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">对照人工修改，记录纠正</text><path d="M965 680 L1356 680" stroke="#2D3B40" stroke-width="1"/><text x="57" y="804" font-size="21" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">依据实际证据判断；按有效授权交付；未闭环事项留给下一次运行。</text></svg>