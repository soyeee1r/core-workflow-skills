<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-label="个人助理流程"><title>个人助理流程</title><rect width="100%" height="100%" fill="#111718"/><text x="40" y="56" font-size="34" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">个人助理</text><rect x="40" y="95" width="310" height="142" fill="#1b2425" stroke="#3c4a46"/><text x="60" y="130" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">01</text><text x="60" y="163" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">白名单证据</text><text x="60" y="197" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">周报 / 消息 / 项目 / 日程</text><path d="M350 166 L379 166" stroke="#d9f56a" stroke-width="2" fill="none"/><polyline points="371.0,171.0 379,166 371.0,161.0" stroke="#d9f56a" stroke-width="2" fill="none"/><rect x="390" y="95" width="310" height="142" fill="#1b2425" stroke="#3c4a46"/><text x="410" y="130" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">02</text><text x="410" y="163" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">累计个人状态</text><text x="410" y="197" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">稿件 / 选题 / 未闭环事项</text><path d="M700 166 L729 166" stroke="#d9f56a" stroke-width="2" fill="none"/><polyline points="721.0,171.0 729,166 721.0,161.0" stroke="#d9f56a" stroke-width="2" fill="none"/><rect x="740" y="95" width="310" height="142" fill="#1b2425" stroke="#3c4a46"/><text x="760" y="130" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">03</text><text x="760" y="163" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">按模式组织</text><text x="760" y="197" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">面板 / 待办 / 排期 / 复盘</text><path d="M1050 166 L1079 166" stroke="#d9f56a" stroke-width="2" fill="none"/><polyline points="1071.0,171.0 1079,166 1071.0,161.0" stroke="#d9f56a" stroke-width="2" fill="none"/><rect x="1090" y="95" width="310" height="142" fill="#1b2425" stroke="#3c4a46"/><text x="1110" y="130" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">04</text><text x="1110" y="163" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">最小范围交付</text><text x="1110" y="197" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">草稿或授权写回 + 回读核对</text><text x="40" y="303" font-size="21" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">七种模式共享事实；计划不是成果，个人动作与团队结果分开。</text></svg>