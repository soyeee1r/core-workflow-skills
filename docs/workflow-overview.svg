<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="0615 内容工作流：信息、行动、反馈与复盘"><title>0615 内容工作流：信息、行动、反馈与复盘</title><rect width="100%" height="100%" fill="#111718"/><text x="44" y="51" font-size="22" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">CORE WORKFLOW / 四个入口，连接内容工作的前后两端</text><text x="44" y="100" font-size="22" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">发布前 · 理解与安排</text><rect x="44" y="128" width="385" height="132" fill="#1b2425" stroke="#3c4a46"/><text x="64" y="163" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">01  外部信息</text><text x="64" y="196" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">X 链接读取</text><text x="64" y="230" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">原文 / 上下文 / 图视频 → 有来源的摘要</text><rect x="527" y="128" width="385" height="132" fill="#1b2425" stroke="#3c4a46"/><text x="547" y="163" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">02  个人工作</text><text x="547" y="196" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">个人助理</text><text x="547" y="230" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">周报 / 消息 / 日程 → 今日行动</text><rect x="1010" y="128" width="385" height="132" fill="#1b2425" stroke="#3c4a46"/><text x="1030" y="163" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">人工环节</text><text x="1030" y="196" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">选题、创作与制作</text><text x="1030" y="230" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">由人判断、推进与确认</text><path d="M429 194 L515 194" stroke="#adb8b1" stroke-width="2" fill="none" stroke-dasharray="7 7"/><polyline points="507.0,199.0 515,194 507.0,189.0" stroke="#adb8b1" stroke-width="2" fill="none"/><path d="M912 194 L998 194" stroke="#adb8b1" stroke-width="2" fill="none" stroke-dasharray="7 7"/><polyline points="990.0,199.0 998,194 990.0,189.0" stroke="#adb8b1" stroke-width="2" fill="none"/><text x="44" y="321" font-size="22" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">发布后 · 两路观察</text><rect x="44" y="350" width="385" height="132" fill="#1b2425" stroke="#3c4a46"/><text x="64" y="385" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">03  观众反馈</text><text x="64" y="418" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">抖音爬楼</text><text x="64" y="452" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">评论 + 全时长弹幕 → 联合报告</text><rect x="527" y="350" width="385" height="132" fill="#1b2425" stroke="#3c4a46"/><text x="547" y="385" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">04  后台表现</text><text x="547" y="418" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">数据回收</text><text x="547" y="452" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">抖音 / 视频号 × 2h / 6h / 24h / 48h</text><rect x="1010" y="350" width="385" height="132" fill="#1b2425" stroke="#3c4a46"/><text x="1030" y="385" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">人工 / 平台证据</text><text x="1030" y="418" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">真实发布事件</text><text x="1030" y="452" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">明确作品、平台、账号与时间</text><path d="M1200 260 L1200 338" stroke="#adb8b1" stroke-width="2" fill="none" stroke-dasharray="7 7"/><polyline points="1195.0,330.0 1200,338 1205.0,330.0" stroke="#adb8b1" stroke-width="2" fill="none"/><path d="M1010 416 L965 416" stroke="#adb8b1" stroke-width="2" fill="none" stroke-dasharray="7 7"/><polyline points="973.0,411.0 965,416 973.0,421.0" stroke="#adb8b1" stroke-width="2" fill="none"/><path d="M965 416 L965 300" stroke="#adb8b1" stroke-width="2" fill="none" stroke-dasharray="7 7"/><polyline points="970.0,308.0 965,300 960.0,308.0" stroke="#adb8b1" stroke-width="2" fill="none"/><path d="M965 300 L400 300" stroke="#adb8b1" stroke-width="2" fill="none" stroke-dasharray="7 7"/><polyline points="408.0,295.0 400,300 408.0,305.0" stroke="#adb8b1" stroke-width="2" fill="none"/><path d="M400 300 L400 338" stroke="#adb8b1" stroke-width="2" fill="none" stroke-dasharray="7 7"/><polyline points="395.0,330.0 400,338 405.0,330.0" stroke="#adb8b1" stroke-width="2" fill="none"/><path d="M850 300 L850 338" stroke="#adb8b1" stroke-width="2" fill="none" stroke-dasharray="7 7"/><polyline points="845.0,330.0 850,338 855.0,330.0" stroke="#adb8b1" stroke-width="2" fill="none"/><text x="44" y="788" font-size="19" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">爬楼按明确请求触发；数据回收按可识别的发布事件与授权排程。虚线均为人工衔接或按需调用。</text><path d="M234 482 L234 578" stroke="#d9f56a" stroke-width="2" fill="none"/><polyline points="229.0,570.0 234,578 239.0,570.0" stroke="#d9f56a" stroke-width="2" fill="none"/><path d="M719 482 L719 578" stroke="#d9f56a" stroke-width="2" fill="none"/><polyline points="714.0,570.0 719,578 724.0,570.0" stroke="#d9f56a" stroke-width="2" fill="none"/><rect x="44" y="590" width="868" height="130" fill="#1b2425" stroke="#3c4a46"/><text x="64" y="625" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">输出</text><text x="64" y="658" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">可追溯的反馈与复盘</text><text x="64" y="692" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">评论观点有原文；数字有快照；结论能回指证据。</text><rect x="1010" y="590" width="385" height="130" fill="#1b2425" stroke="#3c4a46"/><text x="1030" y="625" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">人工衔接</text><text x="1030" y="658" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">下一轮判断与行动</text><text x="1030" y="692" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">人确认并纳入选题、待办或复盘</text><path d="M912 654 L998 654" stroke="#adb8b1" stroke-width="2" fill="none" stroke-dasharray="7 7"/><polyline points="990.0,659.0 998,654 990.0,649.0" stroke="#adb8b1" stroke-width="2" fill="none"/></svg>