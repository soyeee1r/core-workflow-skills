<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-label="定时数据回收流程"><title>定时数据回收流程</title><rect width="100%" height="100%" fill="#111718"/><text x="40" y="56" font-size="34" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">定时数据回收</text><rect x="40" y="95" width="310" height="142" fill="#1b2425" stroke="#3c4a46"/><text x="60" y="130" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">01</text><text x="60" y="163" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">真实发布</text><text x="60" y="197" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">唯一作品 + 实际发布时间</text><path d="M350 166 L379 166" stroke="#d9f56a" stroke-width="2" fill="none"/><polyline points="371.0,171.0 379,166 371.0,161.0" stroke="#d9f56a" stroke-width="2" fill="none"/><rect x="390" y="95" width="310" height="142" fill="#1b2425" stroke="#3c4a46"/><text x="410" y="130" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">02</text><text x="410" y="163" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">四个触发点</text><text x="410" y="197" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">2h / 6h / 24h / 48h</text><path d="M700 166 L729 166" stroke="#d9f56a" stroke-width="2" fill="none"/><polyline points="721.0,171.0 729,166 721.0,161.0" stroke="#d9f56a" stroke-width="2" fill="none"/><rect x="740" y="95" width="310" height="142" fill="#1b2425" stroke="#3c4a46"/><text x="760" y="130" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">03</text><text x="760" y="163" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">双平台快照</text><text x="760" y="197" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">作品详情 / 原始证据 / 校验</text><path d="M1050 166 L1079 166" stroke="#d9f56a" stroke-width="2" fill="none"/><polyline points="1071.0,171.0 1079,166 1071.0,161.0" stroke="#d9f56a" stroke-width="2" fill="none"/><rect x="1090" y="95" width="310" height="142" fill="#1b2425" stroke="#3c4a46"/><text x="1110" y="130" font-size="16" fill="#d9f56a" font-family="PingFang SC,Microsoft YaHei,sans-serif">04</text><text x="1110" y="163" font-size="26" fill="#eef0e8" font-family="PingFang SC,Microsoft YaHei,sans-serif">同一项目文档</text><text x="1110" y="197" font-size="17" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">窗口对比 / 阶段回执 / 复盘</text><text x="40" y="303" font-size="21" fill="#adb8b1" font-family="PingFang SC,Microsoft YaHei,sans-serif">两平台同窗口完成后才发回执；历史快照不覆盖，缺失值不填零。</text></svg>