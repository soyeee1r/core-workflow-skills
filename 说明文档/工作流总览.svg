<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-label="内容工作流：四个核心技能"><title>内容工作流：四个核心技能</title><rect x="0" y="0" width="1440" height="1020" rx="0" fill="#131C20"/><rect x="64" y="60" width="5" height="24" rx="0" fill="#B9D7C2"/><text x="83" y="80" font-size="19" font-weight="600" fill="#B9D7C2" font-family="PingFang SC,Microsoft YaHei,sans-serif">0615  /  核心技能</text><text x="1150" y="80" font-size="18" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">工作流使用指南</text><text x="64" y="167" font-size="56" font-weight="600" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">把信息变成行动。</text><text x="65" y="221" font-size="33" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">把反馈留给下一次判断。</text><text x="65" y="285" font-size="21" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">四个工作入口，覆盖内容工作的理解、安排与复盘。</text><path d="M64 325 L1376 325" stroke="#2D3B40" stroke-width="1"/><text x="65" y="365" font-size="16" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">使用场景</text><text x="326" y="365" font-size="16" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">核心技能</text><text x="940" y="365" font-size="16" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">带回什么</text><text x="66" y="443" font-size="39" font-weight="500" fill="#64777C" font-family="PingFang SC,Microsoft YaHei,sans-serif">01</text><text x="137" y="438" font-size="21" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">理解外部信息</text><text x="326" y="439" font-size="29" font-weight="600" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">X 链接读取</text><text x="326" y="479" font-size="19" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">读原文、上下文与图视频</text><circle cx="910" cy="429" r="4" fill="#B9D7C2"/><text x="940" y="438" font-size="23" font-weight="500" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">有来源的摘要</text><text x="940" y="477" font-size="18" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">支持继续研究与选题</text><path d="M326 504 L1374 504" stroke="#2D3B40" stroke-width="1"/><rect x="48" y="516" width="1344" height="122" rx="16" fill="#1C3330"/><text x="66" y="571" font-size="39" font-weight="500" fill="#B9D7C2" font-family="PingFang SC,Microsoft YaHei,sans-serif">02</text><text x="137" y="566" font-size="21" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">安排个人工作</text><text x="326" y="567" font-size="29" font-weight="600" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">个人助理</text><text x="326" y="607" font-size="19" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">接续累计进展与未闭环事项</text><circle cx="910" cy="557" r="4" fill="#B9D7C2"/><text x="940" y="566" font-size="23" font-weight="500" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">今日行动与周期复盘</text><text x="940" y="605" font-size="18" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">晨间面板 / 待办 / 周报 / 月报</text><text x="66" y="699" font-size="39" font-weight="500" fill="#64777C" font-family="PingFang SC,Microsoft YaHei,sans-serif">03</text><text x="137" y="694" font-size="21" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">听见观众反馈</text><text x="326" y="695" font-size="29" font-weight="600" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">抖音爬楼</text><text x="326" y="735" font-size="19" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">合并评论、回复与全时长弹幕</text><circle cx="910" cy="685" r="4" fill="#B9D7C2"/><text x="940" y="694" font-size="23" font-weight="500" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">一篇联合报告</text><text x="940" y="733" font-size="18" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">有原文依据的反馈与问题</text><path d="M326 760 L1374 760" stroke="#2D3B40" stroke-width="1"/><text x="66" y="827" font-size="39" font-weight="500" fill="#64777C" font-family="PingFang SC,Microsoft YaHei,sans-serif">04</text><text x="137" y="822" font-size="21" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">复盘发布表现</text><text x="326" y="823" font-size="29" font-weight="600" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">定时数据回收</text><text x="326" y="863" font-size="19" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">跟踪抖音与视频号后台变化</text><circle cx="910" cy="813" r="4" fill="#B9D7C2"/><text x="940" y="822" font-size="23" font-weight="500" fill="#EDF0EB" font-family="PingFang SC,Microsoft YaHei,sans-serif">四个时间窗口</text><text x="940" y="861" font-size="18" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">2h / 6h / 24h / 48h</text><path d="M326 888 L1374 888" stroke="#2D3B40" stroke-width="1"/><path d="M64 930 L1376 930" stroke="#2D3B40" stroke-width="1"/><text x="65" y="973" font-size="18" font-weight="400" fill="#9DABAC" font-family="PingFang SC,Microsoft YaHei,sans-serif">选题、创作、制作与发布由人推进；四个技能按需使用，结果经确认后接入下一轮工作。</text></svg>